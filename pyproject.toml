[project]
name = "unreal-agent-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["unreal-agent"]

[tool.uv]
package = false

[tool.uv.sources]
unreal-agent = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "looptime>=0.7",
    "pyrefly>=1.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PIE", "PT", "RET", "RUF", "SIM", "UP", "W"]
ignore = ["RUF012"]

[tool.pyrefly]
project-includes = ["packages/*/src", "packages/*/tests"]
search-path = ["packages/unreal-agent/src", "packages/unreal-agent"]
use-ignore-files = true
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["packages/unreal-agent"]
