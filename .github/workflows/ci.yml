name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked
      - run: make check test build

  fuzz:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: coordinator-log
            path: runner/test_coordinator_log_fuzz.py
          - target: run-log
            path: runner/test_run_log_fuzz.py
          - target: coordinator-faults
            path: coordinator/test_fault_fuzz.py
          - target: view-image
            path: operation/test_image_fuzz.py
          - target: sse
            path: primitives/test_sse.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked
      - name: Run property tests
        env:
          FUZZ_PATH: packages/unreal-agent/tests/${{ matrix.path }}
        run: make fuzz HYPOTHESIS_PROFILE=fuzz-ci FUZZ_ARGS="$FUZZ_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: hypothesis-${{ matrix.target }}
          path: .hypothesis/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  harbor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          python-version: '3.14'
          enable-cache: false
      - run: make -C benchmarks/harbor test check build BUNDLE=../../bin/harbor/ci
      - run: make -C benchmarks/harbor smoke BUNDLE=../../bin/harbor/ci
      - run: docker build -t unreal-agent-ci .
      - run: docker run --rm unreal-agent-ci -h
