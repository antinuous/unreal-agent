name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'unreallabsai/unreal-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[01]\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked
      - run: make check test
      - name: Build distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(uv version --package unreal-agent --short)
          [[ "v$version" == "$RELEASE_TAG" ]] || {
            echo "package version $version does not match tag $RELEASE_TAG" >&2
            exit 1
          }
          uv build --package unreal-agent --out-dir dist
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: build
    environment: release-env
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      IMAGE: unrea1labs/unreal-agent
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and test both platforms
        shell: bash
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --tag "unreal-agent-smoke:$arch" .
            docker run --rm --platform "linux/$arch" "unreal-agent-smoke:$arch" -h
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish Docker image
        shell: bash
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.licenses=MIT" .

  publish:
    needs: [build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
