[project]
name = "harness-harbor"
version = "0.1.0"
description = "Harbor installed-agent integration for Unreal Agent"
requires-python = ">=3.14"
dependencies = ["harbor==0.22.0"]

[project.optional-dependencies]
modal = ["harbor[modal]==0.22.0"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = ["src", "tests", "build.py"]
search-path = ["src", "."]
use-ignore-files = true
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["."]
